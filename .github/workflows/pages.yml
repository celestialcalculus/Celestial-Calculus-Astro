name: Deploy Celestial Calculus
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web configuration
        env:
          API_BASE: ${{ secrets.CC_API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.CC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.CC_SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, json
          cfg = {
            'API_BASE_URL': os.environ.get('API_BASE',''),
            'SUPABASE_URL': os.environ.get('SUPABASE_URL',''),
            'SUPABASE_ANON_KEY': os.environ.get('SUPABASE_KEY',''),
            'APP_VERSION': '0.2.0'
          }
          pathlib.Path('web/config.js').write_text('window.CC_CONFIG = '+json.dumps(cfg, indent=2)+';\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
